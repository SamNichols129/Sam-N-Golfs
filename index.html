<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Sam N Golf</title><style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1c3028;background:#f6f6f2}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit}header{background:#142d24;color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 20px #0002}.navwrap{max-width:1160px;margin:auto;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font-size:24px;letter-spacing:-1.2px;font-weight:850;white-space:nowrap;cursor:pointer}.brand span{color:#c3d49b}nav{display:flex;gap:4px;align-items:center;overflow-x:auto}nav button{background:none;color:#dce5dd;border:0;padding:11px 13px;border-radius:6px;white-space:nowrap;font-size:13px;font-weight:650}nav button.active,nav button:hover{background:#315343;color:#fff}main{max-width:1160px;margin:auto;padding:35px 24px 80px}.homehero{position:relative;min-height:510px;border-radius:12px;overflow:hidden;background:#344b3c;display:flex;align-items:end;box-shadow:0 18px 40px #1a30221a}.homehero:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#06180ce8 0%,#102b2160 48%,#091f1b12 100%);z-index:1}.homehero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero-inner{position:relative;z-index:2;padding:48px;max-width:720px;color:white}.eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:800;color:#cbdcb2;margin-bottom:15px}.homehero h1{font-size:clamp(45px,8vw,84px);line-height:1;letter-spacing:-3px;margin:0 0 17px}.homehero p{font-size:18px;color:#e6eee6;line-height:1.7;max-width:570px}.heroactions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.btn{border:0;border-radius:7px;padding:12px 18px;font-weight:750;font-size:14px;background:#d2e1b8;color:#183126}.btn:hover{filter:brightness(.94)}.btn.ghost{background:#ffffff20;color:white;border:1px solid #ffffff70}.btn.dark{background:#224c37;color:#fff}.btn.outline{background:#fff;border:1px solid #cdd9ce;color:#254936}.sectiontop{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:32px 0 22px}.sectiontop h1,.sectiontop h2{margin:0;letter-spacing:-1.3px;font-size:clamp(30px,4vw,44px)}.sectiontop p{margin:7px 0 0;color:#738077;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:19px}.tile{background:white;border:1px solid #e2e8df;border-radius:10px;overflow:hidden;text-align:left;padding:0;box-shadow:0 3px 14px #0b28100a;transition:transform .15s,box-shadow .15s}.tile:hover{transform:translateY(-3px);box-shadow:0 12px 25px #0b28101a}.tileimage{height:195px;background:linear-gradient(125deg,#a9bda5,#315b45);display:grid;place-items:center;font-size:45px;color:white}.tileimage img{width:100%;height:100%;object-fit:cover}.tilebody{padding:18px}.tilebody h3{margin:0 0 7px;font-size:20px;letter-spacing:-.5px}.muted{color:#75847a;font-size:13px}.tilebody .muted{line-height:1.5}.tag{display:inline-block;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;color:#3b7453;margin-bottom:10px}.panel{background:#fff;border:1px solid #e0e8df;border-radius:10px;padding:25px;margin:20px 0}.panel h2{margin:0 0 17px}.empty{text-align:center;padding:70px 20px;border:1px dashed #c9d9c8;border-radius:12px;background:#fafbf8;color:#6b7b6c}.empty h2{color:#233d2d}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.full{grid-column:1/-1}label{font-size:13px;font-weight:750;display:block;margin-bottom:7px}input,textarea{width:100%;border:1px solid #cbd8cb;border-radius:7px;padding:12px;background:#fff;color:#173328}textarea{min-height:110px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:13px}.mediaitem{border:1px solid #e0e6df;border-radius:8px;overflow:hidden;background:#f4f7f3}.mediaitem img,.mediaitem video{width:100%;height:200px;object-fit:cover;display:block;background:#132a20}.mediaitem footer{padding:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:#708072;font-size:12px}.mediaitem footer span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.danger{background:none;border:0;color:#b43c3c;font-weight:750}.upload{border:2px dashed #b4c9b5;padding:24px;border-radius:10px;text-align:center;background:#f9fbf8}.upload input{max-width:420px;margin:15px auto}.note{color:#76847a;font-size:12px;line-height:1.6}.introgrid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:22px}.introcard{padding:28px;background:white;border:1px solid #e2e8df;border-radius:10px}.introcard h2{font-size:24px;margin:0 0 10px}.introcard p{line-height:1.8;color:#67766b}.feature{background:#e9eee5}.accolade{padding:23px;background:#fff;border:1px solid #e1e8df;border-radius:9px}.accolade .icon{font-size:28px;margin-bottom:12px}.accolade h3{margin:0 0 7px}.accolade p{color:#6d7c70;font-size:14px;line-height:1.6;margin:0}.back{margin-bottom:20px}.description{line-height:1.8;color:#526557;white-space:pre-wrap}.foot{text-align:center;color:#859287;font-size:12px;padding:22px}.instagram{display:inline-flex;gap:7px;align-items:center;color:#1d5538;font-weight:750;text-decoration:none}.instagram:hover{text-decoration:underline}@media(max-width:800px){.navwrap{display:block;padding:15px 18px}.brand{margin-bottom:13px}nav{padding-bottom:3px}.homehero{min-height:470px}.hero-inner{padding:28px}.introgrid{grid-template-columns:1fr}}@media(max-width:540px){main{padding:18px 14px 55px}.homehero{min-height:440px}.homehero h1{letter-spacing:-2px}.homehero p{font-size:15px}.sectiontop{align-items:start;flex-direction:column}.formgrid{grid-template-columns:1fr}.tileimage{height:180px}.panel{padding:17px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.mediaitem img,.mediaitem video{height:150px}nav button{padding:10px 11px}}
.minimalhero{min-height:min(75vh,740px);border-radius:8px;align-items:center}.minimalhero:before{background:linear-gradient(90deg,rgba(8,18,16,.62),rgba(8,18,16,.18) 65%,rgba(8,18,16,.04))}.minimal-inner{padding:clamp(28px,6vw,88px)}.minimal-inner h1{font-size:clamp(54px,9vw,112px);letter-spacing:-.055em;margin:0 0 20px;font-weight:800;text-shadow:0 2px 22px #0005}.hero-instagram{display:inline-flex;color:white;text-decoration:none;font-size:clamp(15px,2vw,19px);font-weight:600;letter-spacing:.01em;border-bottom:1px solid #fffc;padding-bottom:7px}.hero-instagram:hover{border-color:white;opacity:.85}@media(max-width:540px){.minimalhero{min-height:68vh}.minimal-inner h1{font-size:clamp(48px,13vw,76px)}}

.authbar{display:flex;justify-content:flex-end;gap:10px;margin:0 0 12px}.loginbox{max-width:450px;margin:25px auto}.status{padding:10px 0;color:#425a49}.cover{width:100%;height:190px;object-fit:cover}.mediaitem{position:relative}.mediaitem video{background:#11251c}.mediaitem footer{min-height:40px}.hidden{display:none}.filelabel{font-weight:500}.subtle{font-size:13px;color:#687b6b}.tile{cursor:pointer}.topnote{background:#eef4ec;border:1px solid #d8e5d5;padding:12px;border-radius:8px;margin:15px 0}.formgrid input,.formgrid textarea{max-width:100%}</style></head><body><header><div class="navwrap"><div class="brand" id="brand">Sam <span>N</span> Golf</div><nav><button data-tab="home" class="active">Home</button><button data-tab="trips">Trips</button><button data-tab="rounds">Rounds</button><button data-tab="gallery">The Gallery</button><button data-tab="accolades">Accolades</button></nav></div></header><main><div class="authbar"><button class="btn outline" id="loginButton">Admin login</button><button class="btn outline hidden" id="logoutButton">Sign out</button></div><div id="message" role="status"></div><div id="app"></div></main><div class="foot">© Sam N Golf</div><script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js"></script><script>
const PROJECT_URL='https://hhdqphuwfzloszfeukrb.supabase.co', PUBLISHABLE_KEY='sb_publishable_zQEZ2325X_EHQY0ug0wtKw_XNGA86h1';
const sb=window.supabase.createClient(PROJECT_URL,PUBLISHABLE_KEY);const ADMIN_ID='57ba35e1-f518-44bb-9ec9-ec79ae7ad07e';const BUCKET='golf-media';let user=null,tab='home',selected=null;const app=document.getElementById('app');const msg=document.getElementById('message');const names={trips:'Trips',rounds:'Rounds',gallery:'The Gallery'};const singular={trips:'Trip',rounds:'Round',gallery:'Collection'};function admin(){return user?.id===ADMIN_ID}function esc(v){return String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function notice(s,error=false){msg.textContent=s;msg.style.color=error?'#a32626':'#345943'}function publicUrl(path){return sb.storage.from(BUCKET).getPublicUrl(path).data.publicUrl}function photoOrVideo(m){let u=publicUrl(m.storage_path);return m.mime_type.startsWith('video/')?`<video controls playsinline preload="metadata" src="${esc(u)}"></video>`:`<img loading="lazy" src="${esc(u)}" alt="${esc(m.file_name)}">`}function go(t){tab=t;selected=null;render();window.scrollTo(0,0)}async function render(){document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===tab));document.getElementById('loginButton').classList.toggle('hidden',!!user);document.getElementById('logoutButton').classList.toggle('hidden',!user);if(tab==='home'){app.innerHTML=`<section class="homehero minimalhero"><img src="assets/homepage.jpg" alt="Arizona State Golf Championships with mountains"><div class="hero-inner minimal-inner"><h1>Sam N Golf</h1><a class="hero-instagram" href="https://www.instagram.com/sam.n.golf/" target="_blank" rel="noopener noreferrer">◎ @sam.n.golf ↗</a></div></section>`;return}if(tab==='accolades'){app.innerHTML='<div class="sectiontop"><h1>Accolades</h1></div><div class="grid"><div class="accolade"><h3>Best Scores</h3><p>Coming soon</p></div><div class="accolade"><h3>Tournament Finishes</h3><p>Coming soon</p></div><div class="accolade"><h3>Milestones</h3><p>Coming soon</p></div></div>';return}if(selected)await detail();else await listing()}
async function listing(){let {data,error}=await sb.from('golf_entries').select('id,title,location,played_on,description,created_at').eq('category',tab).order('created_at',{ascending:false});if(error){notice('Could not load entries: '+error.message,true);return}let ids=data.map(x=>x.id);let media=[];if(ids.length){let r=await sb.from('golf_media').select('entry_id,storage_path,mime_type').in('entry_id',ids).order('created_at',{ascending:true});if(r.error){notice(r.error.message,true);return}media=r.data}app.innerHTML=`<div class="sectiontop"><div><h1>${names[tab]}</h1><p>${tab==='trips'?'Golf trips and their stories':tab==='rounds'?'Memorable courses and rounds':'Swings, photos and moments'}</p></div>${admin()?`<button class="btn dark" id="newEntry">+ New ${singular[tab]}</button>`:''}</div>`+(data.length?`<div class="grid">${data.map(x=>{let cover=media.find(m=>m.entry_id===x.id&&m.mime_type.startsWith('image/'));return `<button class="tile" data-entry="${esc(x.id)}"><div class="tileimage">${cover?`<img loading="lazy" src="${esc(publicUrl(cover.storage_path))}" alt="">`:'⛳'}</div><div class="tilebody"><span class="tag">${singular[tab]}</span><h3>${esc(x.title)}</h3><div class="muted">${esc(x.location||'')} ${x.played_on?'· '+esc(x.played_on):''}</div></div></button>`}).join('')}</div>`:`<div class="empty"><h2>No ${names[tab].toLowerCase()} published yet</h2><p>Check back soon.</p></div>`);document.getElementById('newEntry')?.addEventListener('click',()=>editEntry());document.querySelectorAll('[data-entry]').forEach(b=>b.onclick=()=>{selected=b.dataset.entry;render()})}
async function detail(){let r=await sb.from('golf_entries').select('*').eq('id',selected).eq('category',tab).single();if(r.error){notice(r.error.message,true);selected=null;return}let x=r.data;let m=await sb.from('golf_media').select('*').eq('entry_id',x.id).order('created_at',{ascending:true});if(m.error){notice(m.error.message,true);return}app.innerHTML=`<button class="btn outline back" id="back">← Back to ${names[tab]}</button><div class="sectiontop"><div><h1>${esc(x.title)}</h1><p>${esc(x.location||'')} ${x.played_on?'· '+esc(x.played_on):''}</p></div>${admin()?'<button class="btn outline" id="edit">Edit</button>':''}</div>${x.description?`<div class="panel description">${esc(x.description)}</div>`:''}${admin()?`<section class="panel"><h2>Upload photos and videos</h2><p class="subtle">Select multiple files from your iPhone or Mac. Up to 50 MB per file; use MP4 or MOV for videos.</p><input type="file" id="uploads" multiple accept="image/jpeg,image/png,image/webp,image/heic,video/mp4,video/quicktime,video/webm"><p id="progress" role="status"></p></section>`:''}<section class="panel"><h2>Photos & videos (${m.data.length})</h2>${m.data.length?`<div class="gallery">${m.data.map(y=>`<div class="mediaitem">${photoOrVideo(y)}<footer><span>${esc(y.file_name)}</span>${admin()?`<button class="danger" data-remove="${esc(y.id)}">Remove</button>`:''}</footer></div>`).join('')}</div>`:'<p>No media yet.</p>'}</section>${admin()?'<button class="danger" id="deleteEntry">Delete this entry</button>':''}`;document.getElementById('back').onclick=()=>{selected=null;render()};document.getElementById('edit')?.addEventListener('click',()=>editEntry(x));document.getElementById('uploads')?.addEventListener('change',async e=>{let files=[...e.target.files],p=document.getElementById('progress');for(let i=0;i<files.length;i++){let f=files[i];p.textContent=`Uploading ${i+1} of ${files.length}: ${f.name}`;if(f.size>50*1024*1024){notice(`${f.name} exceeds 50 MB`,true);continue}if(!/^(image\/(jpeg|png|webp|heic)|video\/(mp4|quicktime|webm))$/.test(f.type)){notice(`Unsupported file type: ${f.name}`,true);continue}let path=`${x.id}/${crypto.randomUUID()}-${f.name.replace(/[^a-zA-Z0-9._-]/g,'_')}`;let up=await sb.storage.from(BUCKET).upload(path,f,{contentType:f.type,upsert:false});if(up.error){notice('Upload failed: '+up.error.message,true);return}let saved=await sb.from('golf_media').insert({entry_id:x.id,storage_path:path,file_name:f.name,mime_type:f.type});if(saved.error){await sb.storage.from(BUCKET).remove([path]);notice('Media record failed: '+saved.error.message,true);return}}notice('Uploads finished.');render()});document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(!confirm('Remove this file permanently?'))return;let item=m.data.find(z=>z.id===b.dataset.remove);let s=await sb.storage.from(BUCKET).remove([item.storage_path]);if(s.error){notice(s.error.message,true);return}let d=await sb.from('golf_media').delete().eq('id',item.id);if(d.error){notice(d.error.message,true);return}render()});document.getElementById('deleteEntry')?.addEventListener('click',async()=>{if(!confirm('Delete this entry and ALL its files?'))return;for(let z of m.data){let s=await sb.storage.from(BUCKET).remove([z.storage_path]);if(s.error){notice(s.error.message,true);return}}let d=await sb.from('golf_entries').delete().eq('id',x.id);if(d.error){notice(d.error.message,true);return}selected=null;render()})}
function editEntry(x){if(!admin())return;app.innerHTML=`<div class="sectiontop"><h1>${x?'Edit':'New'} ${singular[tab]}</h1></div><form id="entryForm" class="panel"><div class="formgrid"><div class="full"><label for="title">Title</label><input id="title" name="title" required maxlength="120" value="${esc(x?.title||'')}"></div><div><label for="location">Destination / course</label><input id="location" name="location" maxlength="150" value="${esc(x?.location||'')}"></div><div><label for="played_on">Date</label><input id="played_on" name="played_on" type="date" value="${esc(x?.played_on||'')}"></div><div class="full"><label for="description">Story / notes</label><textarea id="description" name="description" maxlength="10000">${esc(x?.description||'')}</textarea></div></div><div class="actions"><button class="btn dark" id="save">Save</button><button type="button" class="btn outline" id="cancel">Cancel</button></div></form>`;document.getElementById('cancel').onclick=render;document.getElementById('entryForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let data={title:String(f.get('title')).trim(),location:String(f.get('location')).trim(),played_on:f.get('played_on')||null,description:String(f.get('description')).trim(),category:tab};let res=x?await sb.from('golf_entries').update(data).eq('id',x.id).select('id').single():await sb.from('golf_entries').insert(data).select('id').single();if(res.error){notice('Save failed: '+res.error.message,true);return}selected=res.data.id;notice('Saved.');render()}}
async function showLogin(){app.innerHTML=`<div class="panel loginbox"><h2>Admin sign in</h2><form id="loginForm"><label>Email</label><input name="email" type="email" required autocomplete="email"><label style="margin-top:15px">Password</label><input name="password" type="password" required autocomplete="current-password"><div class="actions"><button class="btn dark">Sign in</button><button type="button" class="btn outline" id="cancelLogin">Cancel</button></div></form></div>`;document.getElementById('cancelLogin').onclick=render;document.getElementById('loginForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);let r=await sb.auth.signInWithPassword({email:String(f.get('email')),password:String(f.get('password'))});if(r.error){notice('Login failed: '+r.error.message,true);return}user=r.data.user;notice(admin()?'Signed in.':'Signed in, but this account is not an administrator.');render()}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>go(b.dataset.tab));document.getElementById('brand').onclick=()=>go('home');document.getElementById('loginButton').onclick=showLogin;document.getElementById('logoutButton').onclick=async()=>{await sb.auth.signOut();user=null;selected=null;notice('Signed out.');render()};(async()=>{let r=await sb.auth.getUser();user=r.data.user;render()})();</script></body></html>
