<!DOCTYPE html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><meta name="theme-color" content="#152b24"><title>Sam N Golf | Golf Journal</title>
<style>
:root{font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#1c3028;background:#f6f6f2}*{box-sizing:border-box}body{margin:0}button,input,textarea{font:inherit}button{cursor:pointer}a{color:inherit}header{background:#142d24;color:#fff;position:sticky;top:0;z-index:10;box-shadow:0 2px 20px #0002}.navwrap{max-width:1160px;margin:auto;padding:18px 24px;display:flex;justify-content:space-between;align-items:center;gap:18px}.brand{font-size:24px;letter-spacing:-1.2px;font-weight:850;white-space:nowrap;cursor:pointer}.brand span{color:#c3d49b}nav{display:flex;gap:4px;align-items:center;overflow-x:auto}nav button{background:none;color:#dce5dd;border:0;padding:11px 13px;border-radius:6px;white-space:nowrap;font-size:13px;font-weight:650}nav button.active,nav button:hover{background:#315343;color:#fff}main{max-width:1160px;margin:auto;padding:35px 24px 80px}.homehero{position:relative;min-height:510px;border-radius:12px;overflow:hidden;background:#344b3c;display:flex;align-items:end;box-shadow:0 18px 40px #1a30221a}.homehero:before{content:"";position:absolute;inset:0;background:linear-gradient(0deg,#06180ce8 0%,#102b2160 48%,#091f1b12 100%);z-index:1}.homehero img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}.hero-inner{position:relative;z-index:2;padding:48px;max-width:720px;color:white}.eyebrow{font-size:11px;letter-spacing:3px;text-transform:uppercase;font-weight:800;color:#cbdcb2;margin-bottom:15px}.homehero h1{font-size:clamp(45px,8vw,84px);line-height:1;letter-spacing:-3px;margin:0 0 17px}.homehero p{font-size:18px;color:#e6eee6;line-height:1.7;max-width:570px}.heroactions{display:flex;gap:12px;flex-wrap:wrap;margin-top:24px}.btn{border:0;border-radius:7px;padding:12px 18px;font-weight:750;font-size:14px;background:#d2e1b8;color:#183126}.btn:hover{filter:brightness(.94)}.btn.ghost{background:#ffffff20;color:white;border:1px solid #ffffff70}.btn.dark{background:#224c37;color:#fff}.btn.outline{background:#fff;border:1px solid #cdd9ce;color:#254936}.sectiontop{display:flex;align-items:end;justify-content:space-between;gap:15px;margin:32px 0 22px}.sectiontop h1,.sectiontop h2{margin:0;letter-spacing:-1.3px;font-size:clamp(30px,4vw,44px)}.sectiontop p{margin:7px 0 0;color:#738077;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:19px}.tile{background:white;border:1px solid #e2e8df;border-radius:10px;overflow:hidden;text-align:left;padding:0;box-shadow:0 3px 14px #0b28100a;transition:transform .15s,box-shadow .15s}.tile:hover{transform:translateY(-3px);box-shadow:0 12px 25px #0b28101a}.tileimage{height:195px;background:linear-gradient(125deg,#a9bda5,#315b45);display:grid;place-items:center;font-size:45px;color:white}.tileimage img{width:100%;height:100%;object-fit:cover}.tilebody{padding:18px}.tilebody h3{margin:0 0 7px;font-size:20px;letter-spacing:-.5px}.muted{color:#75847a;font-size:13px}.tilebody .muted{line-height:1.5}.tag{display:inline-block;font-size:10px;letter-spacing:1.3px;text-transform:uppercase;font-weight:800;color:#3b7453;margin-bottom:10px}.panel{background:#fff;border:1px solid #e0e8df;border-radius:10px;padding:25px;margin:20px 0}.panel h2{margin:0 0 17px}.empty{text-align:center;padding:70px 20px;border:1px dashed #c9d9c8;border-radius:12px;background:#fafbf8;color:#6b7b6c}.empty h2{color:#233d2d}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:16px}.full{grid-column:1/-1}label{font-size:13px;font-weight:750;display:block;margin-bottom:7px}input,textarea{width:100%;border:1px solid #cbd8cb;border-radius:7px;padding:12px;background:#fff;color:#173328}textarea{min-height:110px;resize:vertical}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:20px}.gallery{display:grid;grid-template-columns:repeat(auto-fill,minmax(175px,1fr));gap:13px}.mediaitem{border:1px solid #e0e6df;border-radius:8px;overflow:hidden;background:#f4f7f3}.mediaitem img,.mediaitem video{width:100%;height:200px;object-fit:cover;display:block;background:#132a20}.mediaitem footer{padding:8px;display:flex;justify-content:space-between;align-items:center;gap:8px;color:#708072;font-size:12px}.mediaitem footer span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.danger{background:none;border:0;color:#b43c3c;font-weight:750}.upload{border:2px dashed #b4c9b5;padding:24px;border-radius:10px;text-align:center;background:#f9fbf8}.upload input{max-width:420px;margin:15px auto}.note{color:#76847a;font-size:12px;line-height:1.6}.introgrid{display:grid;grid-template-columns:1.2fr .8fr;gap:18px;margin-top:22px}.introcard{padding:28px;background:white;border:1px solid #e2e8df;border-radius:10px}.introcard h2{font-size:24px;margin:0 0 10px}.introcard p{line-height:1.8;color:#67766b}.feature{background:#e9eee5}.accolade{padding:23px;background:#fff;border:1px solid #e1e8df;border-radius:9px}.accolade .icon{font-size:28px;margin-bottom:12px}.accolade h3{margin:0 0 7px}.accolade p{color:#6d7c70;font-size:14px;line-height:1.6;margin:0}.back{margin-bottom:20px}.description{line-height:1.8;color:#526557;white-space:pre-wrap}.foot{text-align:center;color:#859287;font-size:12px;padding:22px}.instagram{display:inline-flex;gap:7px;align-items:center;color:#1d5538;font-weight:750;text-decoration:none}.instagram:hover{text-decoration:underline}@media(max-width:800px){.navwrap{display:block;padding:15px 18px}.brand{margin-bottom:13px}nav{padding-bottom:3px}.homehero{min-height:470px}.hero-inner{padding:28px}.introgrid{grid-template-columns:1fr}}@media(max-width:540px){main{padding:18px 14px 55px}.homehero{min-height:440px}.homehero h1{letter-spacing:-2px}.homehero p{font-size:15px}.sectiontop{align-items:start;flex-direction:column}.formgrid{grid-template-columns:1fr}.tileimage{height:180px}.panel{padding:17px}.gallery{grid-template-columns:repeat(2,minmax(0,1fr))}.mediaitem img,.mediaitem video{height:150px}nav button{padding:10px 11px}}
.minimalhero{min-height:min(75vh,740px);border-radius:8px;align-items:center}.minimalhero:before{background:linear-gradient(90deg,rgba(8,18,16,.62),rgba(8,18,16,.18) 65%,rgba(8,18,16,.04))}.minimal-inner{padding:clamp(28px,6vw,88px)}.minimal-inner h1{font-size:clamp(54px,9vw,112px);letter-spacing:-.055em;margin:0 0 20px;font-weight:800;text-shadow:0 2px 22px #0005}.hero-instagram{display:inline-flex;color:white;text-decoration:none;font-size:clamp(15px,2vw,19px);font-weight:600;letter-spacing:.01em;border-bottom:1px solid #fffc;padding-bottom:7px}.hero-instagram:hover{border-color:white;opacity:.85}@media(max-width:540px){.minimalhero{min-height:68vh}.minimal-inner h1{font-size:clamp(48px,13vw,76px)}}
</style></head><body>
<header><div class="navwrap"><div class="brand" id="brand">Sam <span>N</span> Golf</div><nav aria-label="Main navigation"><button data-tab="home" class="active">Home</button><button data-tab="trips">Trips</button><button data-tab="rounds">Rounds</button><button data-tab="gallery">The Gallery</button><button data-tab="accolades">Accolades</button></nav></div></header><main id="app"></main><div class="foot">© <span id="year"></span> Sam N Golf</div>
<script>
// PERSONALIZE THESE TWO SETTINGS. Replace the photo URL with a photo you own when ready.
const PROFILE={instagram:'sam.n.golf',heroImage:'assets/homepage.jpg'};
const app=document.getElementById('app');document.getElementById('year').textContent=new Date().getFullYear();let db,view='home',selected=null,urls=[];
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('fairway-journal-v1',2);r.onupgradeneeded=()=>{let d=r.result;if(!d.objectStoreNames.contains('trips'))d.createObjectStore('trips',{keyPath:'id'});if(!d.objectStoreNames.contains('media')){let s=d.createObjectStore('media',{keyPath:'id'});s.createIndex('tripId','tripId')}if(!d.objectStoreNames.contains('entries'))d.createObjectStore('entries',{keyPath:'id'});if(!d.objectStoreNames.contains('extraMedia')){let s=d.createObjectStore('extraMedia',{keyPath:'id'});s.createIndex('entryId','entryId')}};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function store(n,mode='readonly'){return db.transaction(n,mode).objectStore(n)}function req(r){return new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}const all=n=>req(store(n).getAll()),put=(n,x)=>req(store(n,'readwrite').put(x)),del=(n,id)=>req(store(n,'readwrite').delete(id));function esc(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateLabel(s){if(!s)return 'Date not set';let [y,m,d]=s.split('-');return m&&d?`${m}/${d}/${y}`:s}function clearURLs(){urls.forEach(URL.revokeObjectURL);urls=[]}function objectURL(blob){let u=URL.createObjectURL(blob);urls.push(u);return u}function title(h,sub,button=''){return `<div class="sectiontop"><div><h1>${h}</h1><p>${sub}</p></div>${button}</div>`}function setView(v){view=v;selected=null;render();window.scrollTo(0,0)}
async function render(){clearURLs();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===view));if(view==='home')return home();if(view==='accolades')return accolades();if(selected)return detail();return listing()}
function home(){app.innerHTML=`<section class="homehero minimalhero"><img src="${esc(PROFILE.heroImage)}" alt="Arizona state golf championships, with the Catalina Mountains in the background"><div class="hero-inner minimal-inner"><h1>Sam N Golf</h1><a class="hero-instagram" href="https://www.instagram.com/${encodeURIComponent(PROFILE.instagram)}/" target="_blank" rel="noopener noreferrer" aria-label="Sam N Golf on Instagram">◎ @${esc(PROFILE.instagram)} ↗</a></div></section>`}
function accolades(){app.innerHTML=title('Accolades','Scores, milestones and golf moments worth remembering.')+`<div class="grid"><div class="accolade"><div class="icon">🏆</div><h3>Best Scores</h3><p>Your lowest rounds and personal records will live here.</p></div><div class="accolade"><div class="icon">🥇</div><h3>Tournament Finishes</h3><p>Share standout finishes, events and competition memories.</p></div><div class="accolade"><div class="icon">⛳</div><h3>Holes-in-One & Milestones</h3><p>Record your biggest golf achievements and memorable shots.</p></div></div><p class="note">These are starter sections. We'll make them editable through your admin dashboard in the cloud-hosted version.</p>`}
const config={trips:{title:'Golf Trips',singular:'Trip',sub:'Golf getaways, adventures and the courses played along the way.',hint:'e.g. California Golf Road Trip'},rounds:{title:'Memorable Rounds',singular:'Round',sub:'A journal of individual courses, special rounds and favorite days on the course.',hint:'e.g. Torrey Pines — South Course'},gallery:{title:'The Gallery',singular:'Collection',sub:'Swing videos, golf photography and everything in between.',hint:'e.g. Favorite Driver Swings'}};
async function listing(){let c=config[view],items= view==='trips'?(await all('trips')):(await all('entries')).filter(x=>x.category===view);items.sort((a,b)=>(b.created||0)-(a.created||0));let media=await all(view==='trips'?'media':'extraMedia');app.innerHTML=title(c.title,c.sub,`<button class="btn dark" id="new">+ New ${c.singular.toLowerCase()}</button>`)+(items.length?`<div class="grid">${items.map(x=>{let mm=media.filter(m=>(view==='trips'?m.tripId:m.entryId)===x.id);let photo=mm.find(m=>m.type.startsWith('image/'));return `<button class="tile" data-id="${esc(x.id)}"><div class="tileimage">${photo?`<img src="${objectURL(photo.blob)}" alt="${esc(x.name)} cover">`:'⛳'}</div><div class="tilebody"><span class="tag">${c.singular}</span><h3>${esc(x.name)}</h3><div class="muted">${esc(x.place||'Location not specified')} · ${dateLabel(x.date)}</div><div class="muted" style="margin-top:10px">${mm.length} photos & videos</div></div></button>`}).join('')}</div>`:`<div class="empty"><h2>Start your ${c.title.toLowerCase()}</h2><p>Create your first ${c.singular.toLowerCase()} and add photos or videos from your phone or computer.</p></div>`);document.getElementById('new').onclick=()=>form();document.querySelectorAll('.tile').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()})}
function form(){let c=config[view];app.innerHTML=title(`New ${c.singular.toLowerCase()}`,'Add a title and details. You can upload photos and videos afterward.')+`<form class="panel" id="entryForm"><div class="formgrid"><div class="full"><label>Title *</label><input name="name" required maxlength="100" placeholder="${esc(c.hint)}"></div><div><label>Location / course</label><input name="place" maxlength="120" placeholder="City, state, or course"></div><div><label>Date</label><input name="date" type="date"></div><div class="full"><label>Story / notes</label><textarea name="description" maxlength="4000" placeholder="What made this memorable?"></textarea></div></div><div class="actions"><button class="btn dark">Create ${c.singular.toLowerCase()}</button><button class="btn outline" type="button" id="cancel">Cancel</button></div></form>`;document.getElementById('cancel').onclick=render;document.getElementById('entryForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),id=crypto.randomUUID(),entry={id,name:String(f.get('name')).trim(),place:String(f.get('place')).trim(),date:f.get('date'),description:String(f.get('description')).trim(),created:Date.now()};if(view!=='trips')entry.category=view;await put(view==='trips'?'trips':'entries',entry);selected=id;render()}}
async function detail(){let isTrip=view==='trips',dataStore=isTrip?'trips':'entries',mediaStore=isTrip?'media':'extraMedia',fk=isTrip?'tripId':'entryId',x=await req(store(dataStore).get(selected));if(!x){selected=null;return render()}let mm=(await all(mediaStore)).filter(m=>m[fk]===selected).sort((a,b)=>b.created-a.created);app.innerHTML=`<button class="btn outline back" id="back">← Back to ${esc(config[view].title)}</button>`+title(esc(x.name),`${esc(x.place||'Location not specified')} · ${dateLabel(x.date)}`,`<button class="btn outline" id="edit">Edit details</button>`)+(x.description?`<div class="panel"><div class="description">${esc(x.description)}</div></div>`:'')+`<section class="panel"><h2>Add photos & videos</h2><div class="upload"><strong>Choose photos or videos from your phone or computer</strong><input id="files" type="file" accept="image/*,video/*" multiple><div class="note">Choose several at once. Short swing clips supported.</div></div><div class="note" id="status"></div></section><section class="panel"><h2>Photo & video gallery (${mm.length})</h2>${mm.length?`<div class="gallery">${mm.map(m=>`<div class="mediaitem">${m.type.startsWith('video/')?`<video src="${objectURL(m.blob)}" controls playsinline preload="metadata"></video>`:`<img loading="lazy" src="${objectURL(m.blob)}" alt="${esc(m.name)}">`}<footer><span title="${esc(m.name)}">${esc(m.name)}</span><button class="danger" data-remove="${esc(m.id)}" aria-label="Delete media">✕</button></footer></div>`).join('')}</div>`:`<p class="muted">No media yet. Add your first photo or swing video above.</p>`}</section><button class="danger" id="delete">Delete ${esc(config[view].singular.toLowerCase())}</button><p class="note">Prototype: media is saved in this browser only. It is not shared across devices or backed up. We will connect cloud storage before using this as a public blog.</p>`;document.getElementById('back').onclick=()=>{selected=null;render()};document.getElementById('edit').onclick=()=>editForm(x,dataStore);document.getElementById('files').onchange=async e=>{let files=[...e.target.files],status=document.getElementById('status');status.textContent=`Saving ${files.length} file(s)…`;let saved=0;for(let f of files){if(!f.type.startsWith('video/')&&!f.type.startsWith('image/'))continue;try{await put(mediaStore,{id:crypto.randomUUID(),[fk]:selected,name:f.name,type:f.type,blob:f,created:Date.now()+saved});saved++}catch(err){status.textContent=`Saved ${saved} files; storage error: ${err.message}`;return}}render()};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(confirm('Delete this photo or video?')){await del(mediaStore,b.dataset.remove);render()}});document.getElementById('delete').onclick=async()=>{if(!confirm('Delete this entry and all its media?'))return;for(let m of mm)await del(mediaStore,m.id);await del(dataStore,selected);selected=null;render()}}
function editForm(x,dataStore){app.innerHTML=title('Edit details','Update the title, destination or story.')+`<form class="panel" id="editForm"><div class="formgrid"><div class="full"><label>Title *</label><input name="name" required maxlength="100" value="${esc(x.name)}"></div><div><label>Location / course</label><input name="place" maxlength="120" value="${esc(x.place||'')}"></div><div><label>Date</label><input name="date" type="date" value="${esc(x.date||'')}"></div><div class="full"><label>Story / notes</label><textarea name="description" maxlength="4000">${esc(x.description||'')}</textarea></div></div><div class="actions"><button class="btn dark">Save changes</button><button class="btn outline" type="button" id="cancel">Cancel</button></div></form>`;document.getElementById('cancel').onclick=render;document.getElementById('editForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target);await put(dataStore,{...x,name:String(f.get('name')).trim(),place:String(f.get('place')).trim(),date:f.get('date'),description:String(f.get('description')).trim()});render()}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>setView(b.dataset.tab));document.getElementById('brand').onclick=()=>setView('home');openDB().then(d=>{db=d;render()}).catch(e=>app.innerHTML=`<div class="empty">Browser storage is unavailable: ${esc(e.message)}</div>`);
</script></body></html>
