<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Fairway Journal | Trips</title><style>
:root{font-family:Inter,ui-sans-serif,system-ui,-apple-system,sans-serif;color:#18362a;background:#f5f7f3}*{box-sizing:border-box}body{margin:0}header{background:#123c2b;color:white;padding:20px max(20px,calc((100vw - 1100px)/2));display:flex;align-items:center;justify-content:space-between;gap:20px;flex-wrap:wrap}.brand{font-size:22px;font-weight:800;letter-spacing:-.7px}.brand small{display:block;font-size:11px;letter-spacing:2px;color:#b6d6bf;font-weight:600}nav{display:flex;gap:8px;flex-wrap:wrap}nav button{border:0;color:#d9e8de;background:transparent;padding:10px 13px;border-radius:9px;font-weight:600}nav button.active{background:#2f6348;color:white}main{max-width:1100px;margin:0 auto;padding:32px 20px}.hero{display:flex;justify-content:space-between;gap:20px;align-items:center;margin-bottom:25px;flex-wrap:wrap}h1{font-size:clamp(30px,5vw,46px);letter-spacing:-1.5px;margin:0 0 6px}p{color:#6b7b70;margin:0}.primary{border:0;border-radius:10px;background:#1c6b45;color:white;font-weight:700;padding:13px 18px;cursor:pointer}.primary:hover{background:#145336}.secondary{background:white;border:1px solid #cbd8cd;border-radius:10px;padding:10px 14px;color:#204c34;cursor:pointer;font-weight:650}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(265px,1fr));gap:20px}.trip{border:1px solid #dce6dc;border-radius:16px;overflow:hidden;background:white;cursor:pointer;text-align:left;padding:0;box-shadow:0 3px 12px #123c2b09}.cover{height:185px;background:linear-gradient(135deg,#b4cbb3,#3d7255);display:grid;place-items:center;color:white;font-size:50px;overflow:hidden}.cover img{width:100%;height:100%;object-fit:cover}.tripcontent{padding:18px}.tripcontent h2{font-size:20px;margin:0 0 6px}.meta{color:#728478;font-size:13px}.count{margin-top:14px;font-size:13px;color:#286448;font-weight:700}.empty{border:2px dashed #c9d7c9;border-radius:16px;padding:55px 20px;text-align:center;color:#6c806f}.empty h2{color:#244532}.panel{background:white;border:1px solid #dce6dc;border-radius:16px;padding:22px;margin-bottom:20px}.formgrid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:15px}label{display:block;font-size:13px;font-weight:750;margin-bottom:6px}input,textarea{font:inherit;width:100%;border:1px solid #cbd8cd;border-radius:9px;padding:12px;background:#fff;color:#18362a}textarea{min-height:90px;resize:vertical}.full{grid-column:1/-1}.actions{display:flex;gap:10px;flex-wrap:wrap;margin-top:18px}.back{margin-bottom:18px}.upload{border:2px dashed #b4ccb9;border-radius:14px;padding:22px;text-align:center;background:#f8fbf7}.upload input{max-width:400px;margin:12px auto}.media{display:grid;grid-template-columns:repeat(auto-fill,minmax(170px,1fr));gap:13px}.mediaitem{border:1px solid #dce6dc;border-radius:12px;overflow:hidden;background:#f6f8f5}.mediaitem img,.mediaitem video{width:100%;height:180px;object-fit:cover;background:#193b2c;display:block}.mediaitem footer{display:flex;justify-content:space-between;align-items:center;padding:8px;font-size:12px;color:#667b6d;gap:6px}.danger{border:0;background:none;color:#b13e3e;cursor:pointer;font-weight:700}.note{font-size:13px;color:#697c6e;line-height:1.5;margin-top:12px}.hidden{display:none!important}@media(max-width:600px){header{padding:17px 20px}nav{width:100%;overflow-x:auto;flex-wrap:nowrap}nav button{white-space:nowrap}main{padding:24px 15px}.formgrid{grid-template-columns:1fr}.cover{height:160px}}
</style></head><body><header><div class="brand">⛳ FAIRWAY JOURNAL<small>YOUR GOLF STORY</small></div><nav><button class="active" data-tab="trips">Trips</button><button data-tab="locations">Locations</button><button data-tab="scores">Scores / Accomplishments</button><button data-tab="rankings">Rankings</button></nav></header><main><div id="app"></div></main><script>
const app=document.getElementById('app');let db,view='trips',selected=null,urls=[];
function openDB(){return new Promise((resolve,reject)=>{let r=indexedDB.open('fairway-journal-v1',1);r.onupgradeneeded=()=>{let d=r.result;d.createObjectStore('trips',{keyPath:'id'});let s=d.createObjectStore('media',{keyPath:'id'});s.createIndex('tripId','tripId')};r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}
function store(n,mode='readonly'){return db.transaction(n,mode).objectStore(n)}function req(r){return new Promise((resolve,reject)=>{r.onsuccess=()=>resolve(r.result);r.onerror=()=>reject(r.error)})}const getAll=n=>req(store(n).getAll()),put=(n,x)=>req(store(n,'readwrite').put(x)),del=(n,id)=>req(store(n,'readwrite').delete(id));function escapeHTML(s){return String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function dateLabel(s){if(!s)return 'Dates not set';let [y,m,d]=s.split('-');return `${m}/${d}/${y}`}function clearURLs(){urls.forEach(URL.revokeObjectURL);urls=[]}function objectURL(blob){let u=URL.createObjectURL(blob);urls.push(u);return u}function header(title,subtitle,button=''){return `<div class="hero"><div><h1>${title}</h1><p>${subtitle}</p></div>${button}</div>`}
async function render(){clearURLs();document.querySelectorAll('nav button').forEach(b=>b.classList.toggle('active',b.dataset.tab===view));if(view!=='trips'){app.innerHTML=header(escapeHTML(({locations:'Locations',scores:'Scores / Accomplishments',rankings:'Rankings'})[view]),'Coming next — we are building Trips first.')+`<div class="empty"><h2>This section is planned</h2><p>We'll build it after the Trips experience is ready.</p></div>`;return}if(selected){await renderTrip(selected);return}let trips=(await getAll('trips')).sort((a,b)=>b.created-a.created),media=await getAll('media');app.innerHTML=header('Golf Trips','A home for every course, memory, photo and swing clip.',`<button class="primary" id="newTrip">+ New trip</button>`)+(trips.length?`<div class="grid">${trips.map(t=>{let mm=media.filter(m=>m.tripId===t.id),photo=mm.find(m=>m.type.startsWith('image/'));return `<button class="trip" data-id="${t.id}"><div class="cover">${photo?`<img src="${objectURL(photo.blob)}" alt="Trip cover">`:'⛳'}</div><div class="tripcontent"><h2>${escapeHTML(t.name)}</h2><div class="meta">📍 ${escapeHTML(t.place||'Destination not set')} · ${dateLabel(t.date)}</div><div class="count">${mm.length} photos & videos</div></div></button>`}).join('')}</div>`:`<div class="empty"><div style="font-size:48px">🏌️</div><h2>Your golf adventures start here</h2><p>Create your first trip, then add photos and videos from your phone or MacBook.</p></div>`);document.getElementById('newTrip').onclick=()=>renderForm();document.querySelectorAll('.trip').forEach(b=>b.onclick=()=>{selected=b.dataset.id;render()})}
function renderForm(){app.innerHTML=header('Create a golf trip','Give your trip a name and location. You can add media afterward.')+`<form class="panel" id="tripForm"><div class="formgrid"><div class="full"><label>Trip name *</label><input name="name" required maxlength="100" placeholder="e.g. San Diego Golf Weekend"></div><div><label>Destination</label><input name="place" maxlength="120" placeholder="e.g. San Diego, California"></div><div><label>Trip date</label><input name="date" type="date"></div><div class="full"><label>Description / memories</label><textarea name="description" maxlength="2000" placeholder="Courses played, highlights, people..."></textarea></div></div><div class="actions"><button class="primary">Create trip</button><button type="button" class="secondary" id="cancel">Cancel</button></div></form>`;document.getElementById('cancel').onclick=render;document.getElementById('tripForm').onsubmit=async e=>{e.preventDefault();let f=new FormData(e.target),id=crypto.randomUUID();await put('trips',{id,name:f.get('name').trim(),place:f.get('place').trim(),date:f.get('date'),description:f.get('description').trim(),created:Date.now()});selected=id;render()}}
async function renderTrip(id){let t=await req(store('trips').get(id));if(!t){selected=null;return render()}let media=(await getAll('media')).filter(m=>m.tripId===id).sort((a,b)=>b.created-a.created);app.innerHTML=`<button class="secondary back" id="back">← All trips</button>`+header(escapeHTML(t.name),`📍 ${escapeHTML(t.place||'No destination')} · ${dateLabel(t.date)}`)+`${t.description?`<div class="panel"><p>${escapeHTML(t.description)}</p></div>`:''}<section class="panel"><h2>Add photos & videos</h2><div class="upload"><strong>Choose from your phone's photo library or your computer</strong><input id="files" type="file" accept="image/*,video/*" multiple><div class="note">You can select multiple files. Short swing clips are supported.</div></div><div id="status" class="note"></div></section><section class="panel"><h2>Gallery <span style="color:#7c8d7e;font-size:16px">(${media.length})</span></h2>${media.length?`<div class="media">${media.map(m=>`<div class="mediaitem">${m.type.startsWith('video/')?`<video src="${objectURL(m.blob)}" controls playsinline preload="metadata"></video>`:`<img loading="lazy" src="${objectURL(m.blob)}" alt="${escapeHTML(m.name)}">`}<footer><span title="${escapeHTML(m.name)}">${escapeHTML(m.name.slice(0,19))}</span><button class="danger" data-remove="${m.id}" aria-label="Remove media">✕</button></footer></div>`).join('')}</div>`:`<p>No media yet. Add your first swing clip or course photo above.</p>`}</section><button class="danger" id="deleteTrip">Delete this trip</button><p class="note">Prototype only: files are saved locally in this browser on this device. They are not public, synced or backed up. Large batches may exceed browser storage limits.</p>`;document.getElementById('back').onclick=()=>{selected=null;render()};document.getElementById('files').onchange=async e=>{let files=[...e.target.files],status=document.getElementById('status');status.textContent=`Saving ${files.length} file(s)…`;let saved=0;for(let f of files){if(!f.type.startsWith('video/')&&!f.type.startsWith('image/'))continue;try{await put('media',{id:crypto.randomUUID(),tripId:id,name:f.name,type:f.type,blob:f,created:Date.now()+saved});saved++}catch(err){status.textContent=`Saved ${saved} files. Storage may be full: ${err.message}`;return}}await render()};document.querySelectorAll('[data-remove]').forEach(b=>b.onclick=async()=>{if(confirm('Remove this photo or video?')){await del('media',b.dataset.remove);render()}});document.getElementById('deleteTrip').onclick=async()=>{if(!confirm('Delete this trip and all its photos and videos?'))return;for(let m of media)await del('media',m.id);await del('trips',id);selected=null;render()}}
document.querySelectorAll('nav button').forEach(b=>b.onclick=()=>{view=b.dataset.tab;selected=null;render()});openDB().then(d=>{db=d;render()}).catch(e=>app.innerHTML=`<div class="empty">Browser storage is unavailable: ${escapeHTML(e.message)}. Try Safari or Chrome in a normal browsing window.</div>`);
</script></body></html>
